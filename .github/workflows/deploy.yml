name: Deploy

on:
  push:
    branches:
      - master
  

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment
        id: create_deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: production
          description: Deploying app
          initial-status: in_progress

      - name: Debug deployment output
        run: |
          echo "deployment_id=${{ steps.create_deployment.outputs.deployment_id }}"
          echo "environment_url=${{ steps.create_deployment.outputs.environment_url }}"

      - name: Deploy app
        run: echo "replace this with your real deployment command"

      - name: Mark deployment success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          environment-url: ${{ steps.create_deployment.outputs.environment_url }}
          state: success

      - name: Mark deployment failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.create_deployment.outputs.deployment_id }}
          environment-url: ${{ steps.create_deployment.outputs.environment_url }}
          state: failure

      - name: Create GitHub Issue on Deployment Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = context.workflow;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.substring(0, 7);

            const issueTitle = `[Deployment Failed] master - ${sha}`;
            const issueBody = `## 🔴 Deployment Failure Report

            **Workflow:** ${workflowName}
            **Environment:** Production
            **Branch:** \`${branch}\`
            **Commit:** \`${sha}\`
            **Triggered by:** @${context.actor}
            **Run URL:** ${runUrl}

            ### Details
            The deployment to production has failed. This requires immediate attention.

            ### Action Required
            1. Review the [workflow run](${runUrl}) for detailed error messages
            2. Check the deployment logs
            3. Verify all deployment prerequisites are met
            4. Fix the deployment issues
            5. Re-run the deployment or push a fix

            ### Deployment Information
            - **Environment:** Production
            - **Deployment ID:** ${{ steps.create_deployment.outputs.deployment_id }}
            - **Status:** Failed

            ⚠️ **CRITICAL:** Production deployment failure requires immediate attention!

            ---
            *This issue was automatically created by GitHub Actions*`;

            // Check if similar issue already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-failure,deployment',
              per_page: 100
            });

            const similarIssue = existingIssues.data.find(issue =>
              issue.title.includes(sha) && issue.title.includes('Deployment Failed')
            );

            if (!similarIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['automated-failure', 'deployment', 'critical', 'bug']
              });
            } else {
              console.log('Similar issue already exists:', similarIssue.number);
            }